name: Test

# Runs on its own for pull requests and for pushes to any branch but main.
# On main the suite runs as the first job of the deploy workflow instead, via
# workflow_call, so the build cannot start unless the tests pass on that exact
# commit — and both show up as checks on the commit itself.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
